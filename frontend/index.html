<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrintsOne</title>

    <link rel="stylesheet" href="css/splash.css">

</head>

<body>

    <!-- Splash Screen -->

    <section id="splash">

        <div class="logoContainer">

            <!-- Circle -->

            <svg class="circleSVG" viewBox="0 0 600 600">

                <defs>

                    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">

                        <stop offset="0%" stop-color="#FFF8C6"/>
                        <stop offset="50%" stop-color="#FFD700"/>
                        <stop offset="100%" stop-color="#FFA500"/>

                    </linearGradient>

                </defs>

                <!-- White Circle -->

                <circle
                    class="ring"
                    cx="300"
                    cy="300"
                    r="200">
                </circle>

                <!-- Golden Drawing Circle -->

                <circle
                    id="drawCircle"
                    cx="300"
                    cy="300"
                    r="200">
                </circle>

                <!-- Moving Golden Dot -->

                <circle
                    id="runner"
                    cx="300"
                    cy="100"
                    r="8">
                </circle>

            </svg>

            <!-- Logo -->

            <img
                src="assets/logos/logo.png"
                class="logo"
                alt="PrintsOne">

            <!-- Shine -->

            <div class="shine"></div>

        </div>

    </section>

    <!-- Home -->

    <main id="website">

        <!-- Home Page Starts Here -->

    </main>

    <script src="js/splash.js"></script>

</body>

</html>
